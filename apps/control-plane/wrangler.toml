name = "avos-control-plane"
main = "src/index.ts"
compatibility_date = "2025-03-10"
assets = { directory = "../web/dist", binding = "ASSETS", run_worker_first = ["/api/*"] }

[[d1_databases]]
binding = "DB"
database_name = "avos-local"
database_id = "local-placeholder"
migrations_dir = "../../migrations"
[[kv_namespaces]]
binding = "DOCUMENTS"
id = "LOCAL_KV_ID"
[[durable_objects.bindings]]
name = "RUNS"
class_name = "RunCoordinator"
[[queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "avos-dispatch-local"
[[queues.consumers]]
queue = "avos-dispatch-local"
max_batch_size = 10
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunCoordinator"]

[env.preview]
name = "avos-control-plane-preview"
[[env.preview.d1_databases]]
binding = "DB"
database_name = "avos-preview"
database_id = "PREVIEW_D1_ID"
migrations_dir = "../../migrations"
[[env.preview.kv_namespaces]]
binding = "DOCUMENTS"
id = "PREVIEW_KV_ID"
[[env.preview.durable_objects.bindings]]
name = "RUNS"
class_name = "RunCoordinator"
[[env.preview.queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "avos-dispatch-preview"

[env.production]
name = "avos-control-plane"
[[env.production.d1_databases]]
binding = "DB"
database_name = "avos-production"
database_id = "PRODUCTION_D1_ID"
migrations_dir = "../../migrations"
[[env.production.kv_namespaces]]
binding = "DOCUMENTS"
id = "<generated production namespace ID>"
[[env.production.durable_objects.bindings]]
name = "RUNS"
class_name = "RunCoordinator"
[[env.production.queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "avos-dispatch-production"
# Secrets configured with `wrangler secret put`: SESSION_HMAC_KEY, GITHUB_APP_PRIVATE_KEY,
# GITHUB_APP_ID, GITHUB_WEBHOOK_SECRET, OIDC_AUDIENCE, CREDENTIAL_KEK.

[env.local]
name = "avos-control-plane-local"
[[env.local.d1_databases]]
binding = "DB"
database_name = "avos-local"
database_id = "local-placeholder"
migrations_dir = "../../migrations"
[[env.local.kv_namespaces]]
binding = "DOCUMENTS"
id = "LOCAL_KV_ID"
[[env.local.durable_objects.bindings]]
name = "RUNS"
class_name = "RunCoordinator"
[[env.local.queues.producers]]
binding = "DISPATCH_QUEUE"
queue = "avos-dispatch-local"

[vars]
FREE_ONLY_MODE = "true"
MAX_KV_WRITES_PER_DAY = "800"
MAX_D1_WRITES_PER_DAY = "80000"
MAX_D1_ROWS_READ_PER_DAY = "4000000"
MAX_GITHUB_MINUTES_PER_MONTH = "1500"
MAX_ATTACHMENT_BYTES = "20971520"
MAX_MISSION_ATTACHMENT_BYTES = "52428800"
MAX_PROMPT_BYTES = "2097152"
TEMP_DOCUMENT_DAYS = "10"
