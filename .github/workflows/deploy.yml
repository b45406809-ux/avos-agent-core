name: Validate Cloudflare control plane
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
# Bootstrap deployment is intentionally local and interactive. Never pass bootstrap
# credentials as workflow_dispatch inputs. Store a scoped token as a repository
# secret only if a fork owner deliberately adds an authenticated update workflow.
