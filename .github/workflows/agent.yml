name: AVOS GitHub executor
on:
  workflow_dispatch:
    inputs:
      run_id: { description: 'Opaque AVOS run ID', required: true, type: string }
      correlation_id: { description: 'Opaque dispatch correlation ID', required: true, type: string }
      control_plane_environment: { description: 'Control-plane environment', required: true, type: choice, options: [production, preview] }
      protocol_version: { description: 'Wire protocol version', required: true, default: '1', type: string }
permissions:
  contents: read
  id-token: write
concurrency:
  group: avos-${{ inputs.run_id }}
  cancel-in-progress: false
jobs:
  executor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RUN_ID: ${{ inputs.run_id }}
      CORRELATION_ID: ${{ inputs.correlation_id }}
      CONTROL_PLANE_ORIGIN: ${{ vars[format('AVOS_{0}_ORIGIN', inputs.control_plane_environment)] }}
      OIDC_AUDIENCE: avos-runner
      WARM_IDLE_MS: '180000'
      WORKSPACE_DIR: ${{ github.workspace }}/workspace
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, persist-credentials: false, path: core }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install deterministic runtime
        working-directory: core
        run: npm ci --ignore-scripts
      - name: Start supervisor
        id: supervisor
        timeout-minutes: 340
        shell: bash
        working-directory: core
        run: |
          trap 'kill -TERM "$pid" 2>/dev/null || true; wait "$pid" || true' TERM INT
          node packages/agent-runtime/src/supervisor.mjs & pid=$!
          wait "$pid"
      - name: Emergency diagnostics
        if: failure() && steps.supervisor.outcome == 'failure'
        run: |
          mkdir -p diagnostics
          git status --short > diagnostics/git-status.txt
          printf 'run=%s\nworkflow=%s\n' "$RUN_ID" "$GITHUB_RUN_ID" > diagnostics/identity.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: 'avos-emergency-diagnostics', path: diagnostics, retention-days: 3 }
      - name: Terminal cleanup report
        if: always()
        run: |
          git worktree prune || true
          echo 'Runner exited; the control plane owns terminal-state reconciliation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Publishing is performed only through approved, repository-scoped control-plane capabilities.' >> "$GITHUB_STEP_SUMMARY"
