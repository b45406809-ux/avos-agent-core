name: Autonomous Agent Swarm Engine

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Repository (e.g., owner/repo)'
        required: true
        type: string
      target_branch:
        description: 'Base branch to work on'
        required: true
        default: 'main'
        type: string
      user_prompt:
        description: 'High-level goal or architectural specification'
        required: true
        type: string
      max_workers:
        description: 'Maximum concurrent worker agents'
        required: false
        default: '4'
        type: string
      create_pr:
        description: 'Create a Pull Request instead of pushing directly to base branch'
        required: false
        default: true
        type: boolean
      ui_secret:
        description: 'Security validation token'
        required: true
        type: string

# Ensure only one swarm operates on the same target repository at any given time
concurrency:
  group: swarm-${{ github.event.inputs.target_repo }}-${{ github.event.inputs.target_branch }}
  cancel-in-progress: false

jobs:
  orchestrate-swarm:
    name: Swarm Execution Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Generous timeout for multi-step task DAGs

    steps:
      # =======================================================================
      # Step 1: Zero-Trust Security Gate
      # =======================================================================
      - name: 🛡️ Security Gate Check
        id: security_gate
        run: |
          if [ -z "${{ secrets.AGENT_UI_SECRET }}" ]; then
            echo "::error::Secret AGENT_UI_SECRET is not configured in repository settings."
            exit 1
          fi
          
          if [ "${{ github.event.inputs.ui_secret }}" != "${{ secrets.AGENT_UI_SECRET }}" ]; then
            echo "::error::Unauthorized: Invalid security validation token provided."
            exit 1
          fi
          echo "✅ Security gate passed successfully."

      # =======================================================================
      # Step 2: Checkout Engine Control Plane (avos-agent-core)
      # =======================================================================
      - name: 📥 Checkout Agent Core (Control Plane)
        uses: actions/checkout@v4
        with:
          path: core

      # =======================================================================
      # Step 3: Checkout Target Project Workspace (Full Git History for Worktrees)
      # =======================================================================
      - name: 📥 Checkout Target Workspace
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.USER_GITHUB_TOKEN }}
          path: workspace
          fetch-depth: 0 # Full history required for git branch/worktree operations

      # =======================================================================
      # Step 4: System Dependencies (Ripgrep & Build Essentials)
      # =======================================================================
      - name: 🛠️ Install System Tools (Ripgrep, Compilers)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep build-essential git curl jq

      # =======================================================================
      # Step 5: Setup Node.js Runtime & Caches
      # =======================================================================
      - name: 🟢 Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core/package.json

      - name: 📦 Install Engine Dependencies
        working-directory: core
        run: |
          npm ci || npm install

      # =======================================================================
      # Step 6: Configure Git Identity & Worktree Environment
      # =======================================================================
      - name: ⚙️ Configure Git & Worktree Permissions
        run: |
          git config --global user.name "AVOS Swarm Engine"
          git config --global user.email "swarm-agent@avos.ai"
          git config --global core.quotepath false
          
          # Mark paths safe to avoid dubious ownership errors across worktrees
          git config --global --add safe.directory $(pwd)/workspace
          git config --global --add safe.directory "*"
          
          # Initialize directory for isolated worker branches
          mkdir -p .worktrees
          mkdir -p core/.agent

      # =======================================================================
      # Step 7: Execute Master Swarm Orchestrator
      # =======================================================================
      - name: 🐝 Execute Cursor-Class Agent Swarm
        id: run_swarm
        working-directory: core
        env:
          WORKSPACE_DIR: '../workspace'
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
          MAX_CONCURRENCY: ${{ github.event.inputs.max_workers }}
          # Provider Cascades (Failover Pool)
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          # Target repo context
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          GH_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
        run: |
          echo "🚀 Initiating Planner-Worker DAG Orchestration..."
          node engine/swarm.mjs

      # =======================================================================
      # Step 8: Commit & Push Changes to Target Repository
      # =======================================================================
      - name: 📤 Commit & Publish Verified Changes
        id: publish_changes
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          CREATE_PR: ${{ github.event.inputs.create_pr }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: |
          # Clean up any leftover worktrees before committing main
          git worktree prune || true
          
          # Check if any changes exist
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ No changes detected. All tests verified existing state or no edits produced."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          TIMESTAMP=$(date +%s)
          SWARM_BRANCH="swarm/update-${TIMESTAMP}"
          
          git add -A
          git commit -m "feat(swarm): ${USER_PROMPT}

          🤖 Generated by AVOS Autonomous Agent Swarm
          Verified by: Conformance Referee Harness
          Orchestrator: Planner-Worker DAG"

          if [ "$CREATE_PR" = "true" ]; then
            echo "🔀 Creating Pull Request on target repository..."
            git checkout -b "$SWARM_BRANCH"
            git push origin "$SWARM_BRANCH"
            
            gh pr create \
              --repo "${{ github.event.inputs.target_repo }}" \
              --base "$TARGET_BRANCH" \
              --head "$SWARM_BRANCH" \
              --title "feat(swarm): ${USER_PROMPT}" \
              --body "### Autonomous Swarm Execution Summary

              **Goal:** \`${USER_PROMPT}\`

              #### Verification Status
              - All tasks executed in isolated worktrees.
              - Verified through compiler & test oracle checks.
              - Merged into branch \`${SWARM_BRANCH}\`.

              ---
              *Triggered via AVOS Control Plane.*"
          else
            echo "🚀 Pushing directly to base branch ${TARGET_BRANCH}..."
            git push origin "$TARGET_BRANCH"
          fi

      # =======================================================================
      # Step 9: Render Summary into GitHub Actions UI
      # =======================================================================
      - name: 📊 Render Swarm Field Guide to Step Summary
        if: always()
        run: |
          echo "## 🐝 Swarm Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "**Goal:** ${{ github.event.inputs.user_prompt }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** \`${{ github.event.inputs.target_repo }}\` (\`${{ github.event.inputs.target_branch }}\`)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "core/.agent/FIELD_GUIDE.md" ]; then
            echo "### 📋 Stigmergic Field Guide" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat core/.agent/FIELD_GUIDE.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # =======================================================================
      # Step 10: Archive Swarm Telemetry & Logs
      # =======================================================================
      - name: 📦 Upload Telemetry & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-telemetry-${{ github.run_id }}
          path: |
            core/.agent/live_stream.jsonl
            core/.agent/FIELD_GUIDE.md
            core/.agent/task_dag.json
          retention-days: 14
