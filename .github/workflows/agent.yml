name: Autonomous Agent Engine

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target GitHub Repo (e.g. username/avos)'
        required: true
      target_branch:
        description: 'Target Branch'
        default: 'main'
        required: true
      user_prompt:
        description: 'Goal prompt'
        required: true
      ui_secret:
        description: 'Security validation token'
        required: true

jobs:
  agent-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Security Gate
        if: ${{ github.actor != 'YOUR_GITHUB_USERNAME' || github.event.inputs.ui_secret != secrets.AGENT_UI_SECRET }}
        run: |
          echo "❌ Unauthorized access attempt."
          exit 1

      - name: 2. Checkout Control Plane (Agent Core)
        uses: actions/checkout@v4

      - name: 3. Checkout Target Project (e.g. AVOS)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.USER_GITHUB_TOKEN }}
          path: workspace

      - name: 4. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 5. Install Dependencies
        run: npm ci || npm install

      - name: 6. Run Claude Code /goal Engine
        env:
          WORKSPACE_DIR: './workspace'
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
        run: node engine/agent.mjs

      - name: 7. Commit & Push Code to Target Repo
        run: |
          cd workspace
          git config user.name "AVOS Agent"
          git config user.email "agent@avos.ai"
          git add .
          git diff --staged --quiet || (git commit -m "feat(agent): ${{ github.event.inputs.user_prompt }}" && git push origin HEAD)

      - name: 8. Sync Logs to Control Plane
        run: |
          git config user.name "AVOS Agent Bot"
          git config user.email "bot@avos.ai"
          git add .agent/
          git diff --staged --quiet || (git commit -m "chore(logs): update stream" && git push origin main)
