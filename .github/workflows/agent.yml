name: Autonomous Agent Swarm Pipeline

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target Repository (e.g. owner/repo)'
        required: true
        type: string
      target_branch:
        description: 'Base branch in target repository'
        required: true
        default: 'main'
        type: string
      user_prompt:
        description: 'User message or goal'
        required: true
        type: string
      session_id:
        description: 'Session ID'
        required: true
        type: string
      execution_mode:
        description: 'Engine Mode'
        required: false
        default: 'single'
        type: choice
        options:
          - single
          - swarm
      max_workers:
        required: false
        default: '4'
        type: string
      max_budget_tokens:
        required: false
        default: '8000000'
        type: string
      create_pr:
        required: false
        default: false
        type: boolean
      ui_secret:
        required: true
        type: string
      run_id:
        required: true
        type: string
      cf_stream_url:
        required: true
        type: string
      custom_env_json:
        description: 'Custom Environment Variables JSON'
        required: false
        default: '{}'
        type: string

concurrency:
  group: swarm-${{ github.event.inputs.target_repo }}-${{ github.event.inputs.session_id }}
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # =======================================================================
      # 1. Security Gate
      # =======================================================================
      - name: 🛡️ Security Gate Check
        run: |
          if [ "${{ github.event.inputs.ui_secret }}" != "${{ secrets.AGENT_UI_SECRET }}" ]; then
            echo "::error::Unauthorized validation secret"
            exit 1
          fi

      # =======================================================================
      # 2. Checkout Control Plane & Target Codebase
      # =======================================================================
      - name: 📥 Checkout Control Plane Engine
        uses: actions/checkout@v4
        with:
          path: core

      - name: 📥 Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          ref: ${{ github.event.inputs.target_branch }}
          token: ${{ secrets.USER_GITHUB_TOKEN }}
          path: workspace
          fetch-depth: 0

      # =======================================================================
      # 3. Setup Toolchains (Ubuntu has Cargo, Go, Python 3 pre-installed)
      # =======================================================================
      - name: 🛠️ Setup System Dependencies & Package Managers
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ripgrep build-essential git curl jq
          npm install -g pnpm yarn bun @cloudflare/wrangler

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core/package.json

      - name: 📦 Install Engine Dependencies
        working-directory: core
        run: npm ci || npm install

      # =======================================================================
      # 4. Git Worktree Identity
      # =======================================================================
      - name: ⚙️ Configure Git & Worktrees
        run: |
          git config --global user.name "AVOS Agent"
          git config --global user.email "agent@avos.ai"
          git config --global --add safe.directory $(pwd)/workspace
          git config --global --add safe.directory "*"
          mkdir -p .worktrees
          mkdir -p core/.agent

      # =======================================================================
      # 5. Run Engine (With Custom Secrets Injected into Environment)
      # =======================================================================
      - name: 🚀 Run Autonomous Agent Engine
        working-directory: core
        env:
          WORKSPACE_DIR: '../workspace'
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
          SESSION_ID: ${{ github.event.inputs.session_id }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          CF_STREAM_URL: ${{ github.event.inputs.cf_stream_url }}
          AGENT_UI_SECRET: ${{ secrets.AGENT_UI_SECRET }}
          CUSTOM_ENV_JSON: ${{ github.event.inputs.custom_env_json }}
          MAX_CONCURRENCY: ${{ github.event.inputs.max_workers }}
          MAX_BUDGET_TOKENS: ${{ github.event.inputs.max_budget_tokens }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          CEREBRAS_API_KEYS: ${{ secrets.CEREBRAS_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          NVIDIA_API_KEYS: ${{ secrets.NVIDIA_API_KEYS }}
          GH_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.execution_mode }}" = "swarm" ]; then
            node engine/swarm.mjs
          else
            node engine/agent.mjs
          fi

      # =======================================================================
      # 6. Push Verified Changes
      # =======================================================================
      - name: 📤 Commit & Push Code Changes
        if: success()
        working-directory: workspace
        env:
          GH_TOKEN: ${{ secrets.USER_GITHUB_TOKEN }}
          CREATE_PR: ${{ github.event.inputs.create_pr }}
          TARGET_BRANCH: ${{ github.event.inputs.target_branch }}
          USER_PROMPT: ${{ github.event.inputs.user_prompt }}
        run: |
          git worktree prune || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: ${USER_PROMPT}"
            if [ "$CREATE_PR" = "true" ]; then
              BRANCH="swarm/update-$(date +%s)"
              git checkout -b "$BRANCH"
              git push origin "$BRANCH"
              gh pr create --repo "${{ github.event.inputs.target_repo }}" --base "$TARGET_BRANCH" --head "$BRANCH" --title "feat: ${USER_PROMPT}" --body "Automated changes by AVOS Swarm."
            else
              git push origin "$TARGET_BRANCH"
            fi
          fi

      # =======================================================================
      # 7. FAILURE NOTIFICATION WEBHOOK (Prevents UI from hanging)
      # =======================================================================
      - name: 🚨 Notify Failure to Cloudflare Edge
        if: failure()
        run: |
          curl -s -X POST "${{ github.event.inputs.cf_stream_url }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.AGENT_UI_SECRET }}" \
            -d "{\"runId\": \"${{ github.event.inputs.run_id }}\", \"event\": {\"type\": \"error\", \"agentId\": \"GITHUB_RUNNER\", \"data\": {\"error\": \"GitHub Actions runner failed during execution (e.g. branch '${{ github.event.inputs.target_branch }}' not found or repository unreachable). Check GitHub Actions job logs for details.\"}}}" || true