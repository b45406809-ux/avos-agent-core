#:schema node_modules/wrangler/config-schema.json
name = "avos-control-plane"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./ui"

# =============================================================================
# 1. Cloudflare D1 Database Binding (Edge SQLite)
# =============================================================================
# Creates the `env.DB` binding inside your Functions (dispatch.js, events.js, stream.js)
[[d1_databases]]
binding = "DB"
database_name = "avos_swarm_db"
database_id = "3fab855d-eaaf-4714-91ea-b1a79ba896ef" # Generated by `npx wrangler d1 create avos_swarm_db`

# =============================================================================
# 2. Public Environment Variables (Non-Sensitive)
# =============================================================================
[vars]
# The GitHub repository running the actions engine (e.g. your-user/avos-agent-core)
CONTROL_REPO = "b45406809-ux/avos-agent-core"

# =============================================================================
# 3. Environment Overrides (Optional: Staging / Preview)
# =========================================
