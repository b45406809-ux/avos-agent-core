<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVOS Swarm Control Plane</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --purple: #bc8cff;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title-group h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
    }

    .badge.active {
      border-color: var(--success);
      color: var(--success);
    }

    .badge.running {
      border-color: var(--warning);
      color: var(--warning);
    }

    main {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      background: #090d13;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      padding: 8px 10px;
      border-radius: 4px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      background: #238636;
      color: #fff;
      border: 1px solid rgba(240, 246, 252, 0.1);
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #2ea043;
    }

    button:disabled {
      background: #21262d;
      color: var(--text-muted);
      cursor: not-allowed;
      border-color: var(--border);
    }

    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #terminal {
      background: #04070a;
      flex: 1;
      padding: 12px;
      font-size: 0.82rem;
      line-height: 1.45;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-row {
      margin-bottom: 4px;
    }

    .log-time { color: var(--text-muted); }
    .log-tag { font-weight: 700; padding-right: 6px; }
    .tag-init { color: var(--primary); }
    .tag-thought { color: #79c0ff; }
    .tag-tool_start { color: var(--warning); }
    .tag-tool_end { color: #e3b341; }
    .tag-test_verify { color: var(--purple); }
    .tag-test_passed { color: var(--success); }
    .tag-self_healing { color: var(--danger); }
    .tag-branch_merged { color: #56d364; }
    .tag-completed { color: #2ecc71; font-weight: 800; }
    .tag-error { color: var(--danger); font-weight: 700; }
    .tag-stdout { color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>🐝 AVOS Swarm Control Plane</h1>
      <span class="badge" id="status-badge">Standby</span>
    </div>
    <div>
      <span class="badge" id="run-counter">0 Actions Polled</span>
    </div>
  </header>

  <main>
    <!-- Left Configuration Panel -->
    <section class="panel">
      <div class="panel-header">
        <span>Mission Parameters</span>
      </div>
      <div class="panel-body">
        <div>
          <label for="gh_pat">GitHub Personal Access Token</label>
          <input type="password" id="gh_pat" placeholder="ghp_..." autocomplete="off">
        </div>

        <div>
          <label for="control_repo">Control Plane Repo (Runner)</label>
          <input type="text" id="control_repo" placeholder="owner/avos-agent-core">
        </div>

        <div>
          <label for="ui_secret">UI Secret Token</label>
          <input type="password" id="ui_secret" placeholder="AGENT_UI_SECRET value">
        </div>

        <hr style="border: 0; border-top: 1px solid var(--border);">

        <div>
          <label for="target_repo">Target Repository</label>
          <input type="text" id="target_repo" placeholder="owner/target-project">
        </div>

        <div class="grid-2">
          <div>
            <label for="target_branch">Target Branch</label>
            <input type="text" id="target_branch" value="main">
          </div>
          <div>
            <label for="execution_mode">Mode</label>
            <select id="execution_mode">
              <option value="swarm">Multi-Worker Swarm</option>
              <option value="single">Single Agent ReAct</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="max_workers">Max Concurrency</label>
            <input type="number" id="max_workers" value="4" min="1" max="16">
          </div>
          <div>
            <label for="create_pr">Publish Target</label>
            <select id="create_pr">
              <option value="true">Pull Request (PR)</option>
              <option value="false">Direct Commit</option>
            </select>
          </div>
        </div>

        <div>
          <label for="user_prompt">Goal / Architectural Task</label>
          <textarea id="user_prompt" rows="5" placeholder="e.g. Implement a thread-safe LRU page cache for the storage engine and verify with cargo test..."></textarea>
        </div>

        <button id="dispatch-btn" onclick="dispatchSwarm()">
          <span>Launch Mission</span>
        </button>
      </div>
    </section>

    <!-- Right Terminal Output Stream -->
    <section class="panel" id="terminal-container">
      <div class="panel-header">
        <span>Live Telemetry &amp; Verification Stream</span>
        <button style="padding: 2px 8px; font-size: 0.75rem; background: var(--border);" onclick="clearTerminal()">Clear</button>
      </div>
      <div id="terminal">
        <div class="log-row" style="color: var(--text-muted);">&gt; Ready for dispatch. Enter target repository and goal to begin.</div>
      </div>
    </section>
  </main>

  <script>
    // Load persisted configurations from LocalStorage
    const fields = ['gh_pat', 'control_repo', 'ui_secret', 'target_repo', 'target_branch', 'execution_mode', 'max_workers', 'create_pr', 'user_prompt'];
    fields.forEach(f => {
      const val = localStorage.getItem(`avos_${f}`);
      if (val) document.getElementById(f).value = val;
    });

    let pollInterval = null;
    let polledRunsCount = 0;
    let lastLogLength = 0;

    function saveState() {
      fields.forEach(f => {
        localStorage.setItem(`avos_${f}`, document.getElementById(f).value);
      });
    }

    function setBadge(status, text) {
      const badge = document.getElementById('status-badge');
      badge.className = `badge ${status}`;
      badge.innerText = text;
    }

    function clearTerminal() {
      document.getElementById('terminal').innerHTML = '';
      lastLogLength = 0;
    }

    function appendLog(type, agent, text) {
      const term = document.getElementById('terminal');
      const row = document.createElement('div');
      row.className = 'log-row';

      const time = new Date().toLocaleTimeString();
      const typeClass = `tag-${type.toLowerCase()}`;

      row.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-tag ${typeClass}">[${agent}] [${type.toUpperCase()}]</span> <span>${escapeHtml(text)}</span>`;
      term.appendChild(row);
      term.scrollTop = term.scrollHeight;
    }

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    async function dispatchSwarm() {
      saveState();

      const pat = document.getElementById('gh_pat').value.trim();
      const controlRepo = document.getElementById('control_repo').value.trim();
      const uiSecret = document.getElementById('ui_secret').value.trim();
      const targetRepo = document.getElementById('target_repo').value.trim();
      const targetBranch = document.getElementById('target_branch').value.trim();
      const mode = document.getElementById('execution_mode').value;
      const maxWorkers = document.getElementById('max_workers').value;
      const createPr = document.getElementById('create_pr').value === 'true';
      const prompt = document.getElementById('user_prompt').value.trim();

      if (!pat || !controlRepo || !targetRepo || !prompt || !uiSecret) {
        alert('Please fill in PAT, Control Repo, UI Secret, Target Repo, and Goal.');
        return;
      }

      const btn = document.getElementById('dispatch-btn');
      btn.disabled = true;
      setBadge('running', 'Dispatching...');
      appendLog('INIT', 'DASHBOARD', `Dispatching ${mode.toUpperCase()} workflow to ${controlRepo} against ${targetRepo}...`);

      try {
        const res = await fetch(`https://api.github.com/repos/${controlRepo}/actions/workflows/agent.yml/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${pat}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main',
            inputs: {
              target_repo: targetRepo,
              target_branch: targetBranch,
              user_prompt: prompt,
              execution_mode: mode,
              max_workers: maxWorkers,
              create_pr: createPr,
              ui_secret: uiSecret
            }
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({ message: res.statusText }));
          throw new Error(errData.message || res.statusText);
        }

        appendLog('INIT', 'DASHBOARD', 'Workflow dispatched successfully. Waiting for runner spin-up...');
        setBadge('running', 'Agent Running');

        // Allow 6 seconds for runner initialization before polling logs
        setTimeout(() => startLogPolling(pat, controlRepo), 6000);
      } catch (err) {
        appendLog('ERROR', 'DASHBOARD', `Dispatch failed: ${err.message}`);
        setBadge('', 'Failed');
        btn.disabled = false;
      }
    }

    async function startLogPolling(pat, controlRepo) {
      if (pollInterval) clearInterval(pollInterval);

      pollInterval = setInterval(async () => {
        try {
          polledRunsCount++;
          document.getElementById('run-counter').innerText = `${polledRunsCount} Poll Events`;

          // 1. Fetch the latest workflow run
          const runsRes = await fetch(`https://api.github.com/repos/${controlRepo}/actions/workflows/agent.yml/runs?per_page=1`, {
            headers: {
              'Authorization': `Bearer ${pat}`,
              'Accept': 'application/vnd.github+json'
            }
          });

          if (!runsRes.ok) return;
          const runsData = await runsRes.json();
          const latestRun = runsData.workflow_runs?.[0];

          if (!latestRun) return;

          if (latestRun.status === 'completed') {
            clearInterval(pollInterval);
            document.getElementById('dispatch-btn').disabled = false;
            if (latestRun.conclusion === 'success') {
              setBadge('active', 'Completed');
              appendLog('COMPLETED', 'RUNNER', 'Workflow run completed with success.');
            } else {
              setBadge('', 'Run Failed');
              appendLog('ERROR', 'RUNNER', `Workflow concluded with status: ${latestRun.conclusion}`);
            }
          }

          // 2. Fetch active job steps for real-time log traces
          const jobsRes = await fetch(latestRun.jobs_url, {
            headers: {
              'Authorization': `Bearer ${pat}`,
              'Accept': 'application/vnd.github+json'
            }
          });

          if (!jobsRes.ok) return;
          const jobsData = await jobsRes.json();
          const mainJob = jobsData.jobs?.[0];

          if (mainJob && mainJob.steps) {
            const agentStep = mainJob.steps.find(s => s.name.includes('Execute Agent Engine') || s.name.includes('Swarm'));
            if (agentStep && agentStep.status === 'in_progress') {
              setBadge('running', `Step: ${agentStep.name}`);
            }
          }
        } catch (e) {
          console.warn('Polling error:', e);
        }
      }, 5000);
    }
  </script>
</body>
  </html>
